name: APK Unity

# Versão Unity (gráficos melhores): Android (APK) e Windows (instalador).
# Publica como "pré-lançamento" unity-vX.Y.Z, sem mexer no atualizador do jogo antigo.
on:
  push:
    branches: [main]
    paths: ['unity/**', '.github/workflows/unity.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build:
    name: Gerar ${{ matrix.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Android
            target: Android
            method: CarretaJoy.EditorTools.Builder.BuildAndroid
          - nome: Windows
            target: StandaloneWindows64
            method: CarretaJoy.EditorTools.Builder.BuildWindows
    steps:
      - name: Conferir licença do Unity
        if: env.UNITY_LICENSE == '' || env.UNITY_EMAIL == '' || env.UNITY_PASSWORD == ''
        run: |
          echo "::error::Faltam os segredos UNITY_LICENSE, UNITY_EMAIL e UNITY_PASSWORD (Settings > Secrets and variables > Actions). Veja unity/LEIA-ME.md"
          exit 1

      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: ${{ matrix.target != 'Android' }}
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-${{ matrix.target }}-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.target }}-

      - name: Compilar no Unity
        uses: game-ci/unity-builder@v4
        with:
          projectPath: unity
          unityVersion: 6000.3.28f1
          targetPlatform: ${{ matrix.target }}
          androidExportType: androidPackage
          buildName: CarretaJoy3D
          buildMethod: ${{ matrix.method }}
          allowDirtyBuild: true

      - name: Ler versão
        id: ver
        run: echo "v=$(grep -oP 'VERSION = "\K[^"]+' unity/Assets/Scripts/Editor/Builder.cs)" >> "$GITHUB_OUTPUT"

      - name: Renomear APK
        if: matrix.target == 'Android'
        run: |
          f=$(find build -name '*.apk' | head -1)
          echo "APK: $f"; ls -la "$f"
          mkdir -p out && cp "$f" "out/CarretaJoy3D-v${{ steps.ver.outputs.v }}.apk"

      - name: Criar instalador do Windows
        if: matrix.target == 'StandaloneWindows64'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis
          src=$(dirname "$(find build -name 'CarretaJoy3D.exe' | head -1)")
          echo "Jogo em: $src"; ls -la "$src"
          sudo rm -rf "$src"/*_BurstDebugInformation_DoNotShip "$src"/*_BackUpThisFolder_ButDontShipItWithYourGame || true
          cd unity/Installer
          makensis -V2 -DVERSION=${{ steps.ver.outputs.v }} -DSRC="$GITHUB_WORKSPACE/$src" CarretaJoy3D.nsi
          mkdir -p "$GITHUB_WORKSPACE/out" && mv CarretaJoy3D-Setup-*.exe "$GITHUB_WORKSPACE/out/"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: carreta-joy-${{ matrix.target }}
          path: out/*
          retention-days: 30

  release:
    name: Publicar versão
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: unity/Assets/Scripts/Editor
      - name: Ler versão
        id: ver
        run: echo "v=$(grep -oP 'VERSION = "\K[^"]+' unity/Assets/Scripts/Editor/Builder.cs)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - name: Publicar pré-lançamento
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unity-v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          name: Carreta Joy 3D (Unity) v${{ steps.ver.outputs.v }}
          files: out/*
          body: |
            Versão feita em **Unity** (gráficos melhores).

            **Android:** baixe o `.apk`. **Windows:** baixe o `CarretaJoy3D-Setup-…exe` e siga o instalador (atalho na área de trabalho).

            - Arthur e Afonso com os modelos em alta qualidade e animações humanoides (sem deformar)
            - **Ponta Grossa de verdade**: ruas, relevo e bairros reais (Centro, Oficinas, Olarias, Uvaranas, Nova Rússia, Órfãs, Ronda, Jardim Carvalho, Estrela, Boa Vista, Contorno e Cará-Cará), com Catedral, Estação Saudade, Vila Hilda e Estádio Germano Krüger
            - Carreta percorre 24 km de ruas reais com paradas de festa
            - Carreta original com neon, luzes coloridas no ritmo, faróis e música
            - Sombras, brilho (bloom) e cores de cinema
            - Turma toda jogável: Arthur, Afonso, Chaves, Fofão, Chapolin, Máscara, Homem-Aranha, Capitão América e Hulk
            - Mundo aberto: escolha o personagem, explore a cidade, suba na carreta ou **dirija a carreta**
            - Menu inicial, pausa, ajustes (gráficos, 30/60 quadros, câmera, turma segue ou não), ponto de partida da carreta
            - Câmera TPS (sobre o ombro) como padrão, mais normal, perto, longe e aérea; minimapa com a carreta e a turma
            - A carreta segue o percurso sozinha e a turma vai em cima dela dançando (ou: me seguem / parados)
            - Seletor de personagens com fotos; botões ANDAR, CORRER e MANOBRAS
            - Controle de videogame (Xbox, PlayStation e genéricos) no jogo e nos menus
            - **Atualização por dentro do jogo** (menu inicial / Ajustes): baixa e instala sem navegador
            - Parkour e acrobacias novas (animações livres CC0 da Quaternius): rolar, deslizar, salto ninja, escalar muretas, 2ª dança; Afonso começa agachado
            - Subir e descer da carreta, dançar em cima, mortal, flip e pirueta
            - **Novo na 0.7:** rodas da carreta girando (as da frente esterçam ao dirigir); carreta devagar para o comboio acompanhar (espera quem ficou para trás; velocidade em Ajustes)
            - **4 carretas**: a original e 3 novas modeladas para o jogo (Neon, Tropical e Disco), com palco, caixas de som, treliça de luz e bancos
            - **Combos**: dois botões seguidos viram ESTRELA, REVERSÃO, GIRO NO AR, MORTAL LATERAL, CHUTE VOADOR, BREAK e MOONWALK; sequências valem pontos extras
            - **5 danças** (Gangnam, Balanço, Charleston, Dança russa, Salsa): dançando, os botões de manobra trocam o estilo
            - **Gente na cidade**: pessoas passeando, conversando e dançando quando a carreta passa; gente sentada nos bancos da carreta
            - **Trânsito**: 13 tipos de carro (táxi, polícia, ambulância, caminhões...) andando pelas ruas reais na mão certa
            - Menus novos com fotos: das carretas e de cada ponto de partida (vista aérea 3D do lugar); botões de ação menores
            - **Novo na 0.8:** corrigidos o "teletransporte" ao correr (Afonso e turma), os pés tortos do Arthur e o afundamento no chão nas acrobacias
            - **Festa da turma**: as acrobacias enchem o medidor FESTA; cheio, a turma toda dança junta em fileiras e os botões mudam o passo de todos (PULAR faz a ola)
            - Turma desce e dança na rua nas paradas de festa
            - Pessoas com proporção humana (Universal Base Characters da Quaternius, CC0), com roupas, tons de pele e cabelos variados, que acenam, gritam e chamam, dançam ou seguem andando quando a carreta passa; arquibancada com gente sentada na parte de trás da carreta
            - Sons de torcida, palmas e gritos
            - Cidade com texturas novas (reboco, tijolo, telha, calçada de pedra, asfalto, lojas no térreo) e casas modeladas perto do jogador
            - **Novo na 0.9:** pernas retas e pés para a frente em todos os personagens (pose de base corrigida); pés não afundam mais no asfalto e na calçada
            - **Modo seguro** ao dirigir a carreta (até ~15 km/h; botão SEGURO/LIVRE e em Ajustes)
            - **10 músicas de verdade** (funk, disco, house, dance, jazz — todas CC0), tocando embaralhadas; "Próxima música" na pausa
            - Controles mais rápidos: joystick mais sensível, aceleração e freada firmes, pulo "guardado" (aperta um pouco antes de cair e pula ao tocar o chão)
            - Telas ajustadas: tudo dentro da área visível (respeita o entalhe/câmera do celular); menus sem nada cortado
            - **Novo na 0.10:** corrigidos os corpos de todos os 9 personagens (removida a deformação do tronco colando nos braços e pose T-pose padronizada para Humanoid); corrigida a perna torta ao correr no Arthur e em toda a turma (`Run.fbx` e `Walk.fbx` endireitados + pesos entre pernas limpos); personagens agora acompanham, correm e dançam **na rua** ao lado da carreta (nunca em cima), enquanto as pessoas comuns passeiam **sentadas dentro** das 4 carretas abertas; física e animações refinadas (sem FootIK entortando pernas em acrobacias/ar, aderência em ladeiras, colisão suave com a carreta e separação entre a turma)
            - **Novo na 0.10.2:** corrigidas as pernas tortas ao andar/correr em todos os 9 personagens (`ImportRules` agora aplica o Avatar T-pose limpo de `Idle.fbx` em `Run`/`Walk`/`Jump`/`Mortal`/`Flip`/`RunToFlip` e `Passeio_Loop.fbx` em `Sprint_Loop`, eliminando a torção do joelho e pé esquerdo); corrigido o Fofão começando deitado/revirando no chão (danças espontâneas da turma agora usam apenas passos em pé); movimentação da turma na rua muito mais livre e solta ao lado da carreta (sem correr contra a lateral dela, com subidas ocasionais na carreta e volta para a rua); corrigido o menu inicial para não pular direto para a seleção de carreta
            - **Novo na 0.10.3:** corrigidas as pernas curvadas para dentro ao correr/andar em todos os 9 personagens (removido o `FootIK` que puxava os dois pés para o centro `X=0` em `Run`/`Walk`, e curvas musculares `Twist`/`In-Out` niveladas no `ImportRules.cs` para pernas retas e paralelas); corrigido o travamento da turma nas paredes dos prédios (alvos de caminhada agora verificam paredes com `SphereCast`, deslizam pela tangente da fachada e reposicionam para a pista livre caso presos)
            - Créditos: carros e casas Kenney (CC0), pessoas Quaternius (CC0), texturas ambientCG (CC0), sons OpenGameArt (CC0), capturas de movimento CMU (uso livre)
